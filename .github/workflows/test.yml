# Runs every test, including the end-to-end test in a headless browser, on macOS (where the program is used).
# The second job runs the end-to-end test with the real CLIP model; its weights are cached between runs.
name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make test

  e2e-clip:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-ViT-B-32-laion2b_s34b_b79k
      - run: uv sync --locked
      - run: make e2e-clip
