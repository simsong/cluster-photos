[project]
name = "cluster-photos"
version = "0.1.0"
description = "Cluster a photo archive by CLIP embedding and review the clusters on a static HTML page."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "open_clip_torch>=2.26",
    "pillow>=10.3",
    "pillow-heif>=0.18",
    "numpy>=2.0",
    "pydantic>=2,<3",
    "opencv-python-headless>=4.10",
    "sqlite-vec>=0.1.6",
]

[tool.uv]
package = false
